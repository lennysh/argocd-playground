---
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: aap26
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/managed-by: aap-operator
    app.kubernetes.io/name: aap
    app.kubernetes.io/operator-version: ''
    app.kubernetes.io/part-of: aap
spec:
  idle_aap: false
  database:
    database_secret: external-postgres-configuration-gateway
    idle_disabled: false
    postgres_data_volume_init: false
  controller:
    postgres_configuration_secret: external-postgres-configuration-controller
    garbage_collect_secrets: false
    disabled: false
    name: ac
    ee_extra_env: |
      - name: RECEPTOR_KUBE_SUPPORT_RECONNECT
        value: enabled
    extra_settings:
      - setting: AWX_RUNNER_KEEPALIVE_SECONDS
        value: 240
  eda:
    disabled: true
    name: eda
    database:
      database_secret: external-postgres-configuration-eda
    event_stream:
      database_secret: external-postgres-configuration-eda-event-stream
  hub:
    postgres_configuration_secret: external-postgres-configuration-hub
    disabled: true
    file_storage_size: 1Ti
    name: hub
    object_storage_s3_secret: aap26-hub-s3
    pulp_settings:
      cache_enabled: false
    storage_type: s3
  mcp:
    disabled: true
    allow_write_operations: false
    extra_settings:
      - setting: IGNORE_CERTIFICATE_ERRORS
        value: false
  lightspeed:
    disabled: true
  extra_settings:
    - setting: REDIRECT_IS_HTTPS
      value: '"True"'
  feature_flags:
    FEATURE_POLICY_AS_CODE_ENABLED: true
  image_pull_policy: IfNotPresent
  no_log: true
  redis_mode: standalone
  route_tls_termination_mechanism: Edge
...
