---
# Deploys the Ansible automation portal operator (Technology Preview).
# Requires secrets in self-service-portal namespace — see app-automation-portal/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-portal
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "26"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lennysh/argocd-playground.git
    path: app-automation-portal
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: self-service-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: automationportal.aap.redhat.com
      kind: AutomationPortal
      jsonPointers:
        - /status
