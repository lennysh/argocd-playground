---
# Copy to 05-secrets.yml (gitignored) and fill in values. See README.md.
# Apply before the AutomationPortal CR reconciles:
#   oc apply -f 05-secrets.yml
apiVersion: v1
kind: Secret
metadata:
  name: secrets-rhaap-portal
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  aap-host-url: https://CHANGE_ME-AAP-GATEWAY
  oauth-client-id: CHANGE_ME
  oauth-client-secret: CHANGE_ME
  aap-token: CHANGE_ME
---
# Required for OCI dynamic plugin delivery. Secret name must match the
# AutomationPortal CR name: {metadata.name}-registry-auth (portal → portal-registry-auth).
# Prefer generating auth.json from a Registry Service Account:
#   https://access.redhat.com/RegistryAuthentication
apiVersion: v1
kind: Secret
metadata:
  name: portal-registry-auth
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  auth.json: |
    {
      "auths": {
        "registry.redhat.io": {
          "auth": "CHANGE_ME_BASE64_USER_COLON_PASSWORD"
        }
      }
    }
---
# Optional — only if you enable GitHub/GitLab SCM integration on the CR.
apiVersion: v1
kind: Secret
metadata:
  name: secrets-scm
  namespace: self-service-portal
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  github-token: CHANGE_ME
  # gitlab-token: CHANGE_ME
